    section: '3. Data Storage and Security / 4. Data Sharing'
    dated: '2026-03-07'
    entries:
    - {vendor: OpenAI, purpose: 'AI analysis via the OpenAI API (text only, no PII)'}
    - {vendor: Vercel, purpose: hosting}
    - {vendor: Supabase, purpose: hosting / data storage}
    evidence:
    - source: https://policycheck.tools/legal
      http_status: 200
      fetched: '2026-09-19'
      quote: >-
        "We do not sell or share your data with third parties, except: Service Providers: OpenAI API for AI
        analysis (text only, no PII)" and "Hosted on SOC 2 Type II certified infrastructure (Vercel/Supabase)".
    note: >-
      Named processors inside the privacy policy rather than a standalone dated subprocessor table
      (/legal/subprocessors 404). Recorded because the vendors and purposes are stated, with the caveat that
      it is a prose list, not a maintained register.
  ai_transparency:
    url: https://policycheck.tools/legal
    section: 'Terms of Service — 2. Service Description, 3. Not Legal Advice, 4. Accuracy Disclaimer'
    evidence:
    - source: https://policycheck.tools/legal
      http_status: 200
      fetched: '2026-09-19'
      quote: >-
        "LegalEasy is an AI-powered service that analyzes legal documents ... LegalEasy uses AI and automated
        analysis which may contain errors. We do not guarantee the accuracy, completeness, or reliability of
        our summaries."
    - source: https://policycheck.tools/docs#response-fields
      http_status: 200
      fetched: '2026-09-19'
      quote: 'Every response carries analysis_method ("regex_plus_llm" | "regex_only" | "none") and confidence ("high" | "medium" | "low" | "none"); the docs section "Scoring System" states "the LLM identifies clauses, but the score comes from a fixed formula".'
    note: >-
      A published statement that the output is AI-generated and may be wrong, reinforced by a per-response
      machine-readable provenance field naming whether an LLM was involved. Not a dedicated AI transparency page
      (/ai and /ai/transparency were not published), and no model card or training-data summary exists.
