caveat: >-
  The only legal page PolicyCheck publishes (https://policycheck.tools/legal, linked as legal_info_url from
  ai-plugin.json; /terms and /privacy 404) is still branded "LegalEasy" and written for the LegalEasy Shopify
  app ("Store Information: Shopify store domain", "billed monthly through Shopify"). Both documents are dated
  "Last Updated: March 7, 2026". The signals below are recorded as published; whether the page's scope covers the
  PolicyCheck API surface is a question for the provider.
