    url: https://policycheck.tools/legal
    section: '5. GDPR and CCPA Compliance'
    channel: privacy@policycheck.tools
    rights_named: [access (request a copy of your data), deletion, opt-out of analytics tracking, data portability]
    stated_sla: null
    evidence:
    - source: https://policycheck.tools/legal
      http_status: 200
      fetched: '2026-09-19'
      quote: >-
        "If you are in the EU or California, you have the right to: Request a copy of your data; Request deletion
        of your data; Opt-out of analytics tracking; Request data portability. Contact us at
        privacy@policycheck.tools to exercise these rights."
    note: >-
      A documented request channel and named rights, plus a retention statement ("Uninstalled Merchants: Data
      deleted within 30 days of uninstallation; Analytics: Anonymized usage data retained for 12 months"). No
      response period is stated, no intake form or endpoint exists (/privacy/requests 404).
  subprocessors:
