  - {id: quick-risk-check, name: Quick Risk Check}
  - {id: return-policy-analysis, name: Return Policy Analysis}
  - {id: shipping-policy-analysis, name: Shipping Policy Analysis}
  - {id: warranty-analysis, name: Warranty Analysis}
  - {id: terms-and-conditions-analysis, name: Terms & Conditions Analysis}
  - {id: signed-assessment, name: Signed Seller Assessment}
