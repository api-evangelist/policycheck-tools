agent_card:
  name: PolicyCheck
  description: >-
    Seller policy risk intelligence for AI-powered commerce. Analyses seller return policies, shipping terms,
    warranty coverage, terms & conditions, and privacy policies and returns structured risk data for purchasing
    agents.
  version: 1.0.0
  url: https://policycheck.tools/api/a2a
  documentation_url: https://policycheck.tools/docs/a2a
  provider:
    organization: PolicyCheck
    url: https://policycheck.tools
  protocol_version: 0.2.0
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
    signed_assessments:
      version: '1.0'
      assessment_endpoint: /api/v1/signed-assessment
      verify_endpoint: /api/v1/verify
      jwks_endpoint: /.well-known/jwks.json
      signing_algorithm: Ed25519
  default_input_modes: [text/plain, application/json]
  default_output_modes: [application/json]
