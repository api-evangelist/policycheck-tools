surface_relationship:
  note: >-
    The A2A endpoint is the operational core of PolicyCheck's agent surface: the policycheck-mcp stdio package
    is a thin bridge that turns each MCP tool call into an A2A message/send to this endpoint, and the A2A data
    artifact carries the same fields as the REST POST /api/check. The published OpenAPI, by contrast, describes
    only the legacy ChatGPT-plugin operations (/api/chatgpt/analyze, /api/chatgpt/analyze-url) and does not
    include /api/a2a, /api/check or the signed-assessment endpoints.
