- aid: policycheck-tools:policycheck-mcp-server
  name: PolicyCheck MCP Server
  description: >-
    The policycheck-mcp npm package (1.0.2, published 2026-02-13, MIT) is a stdio Model Context Protocol server
    installed with `npx -y policycheck-mcp`. It exposes three tools — analyze_seller (policy page URL),
    quick_risk_check (seller homepage URL) and check_policy_text (raw text) — each implemented as an A2A
    message/send to https://policycheck.tools/api/a2a (the package still defaults to the retired legaleasy.tools
    URL, which 308-redirects). There is no hosted MCP endpoint. Tool names and input schemas were read verbatim
    from the published package source.
  humanURL: https://www.npmjs.com/package/policycheck-mcp
  baseURL: https://policycheck.tools/api/a2a
