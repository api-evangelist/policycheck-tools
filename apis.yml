- aid: policycheck-tools:policycheck-x402-analysis-api
  name: PolicyCheck x402 Analysis API
  description: >-
    Pay-per-request analysis over the x402 protocol: POST https://policycheck.tools/api/x402/analyze answers HTTP
    402 with a PAYMENT-REQUIRED header carrying an x402Version 2 envelope — $0.03 (30000 atomic USDC) per
    analysis on Base mainnet (eip155:8453), scheme exact, 300 s timeout, plus a bazaar discovery extension with a
    JSON Schema for the request body (url, sellerUrl, text) and an example response. After payment the response
    wraps the /api/check analysis fields in a {payment, analysis} envelope with the on-chain receipt. Probed live
    on 2026-09-19; no payment was made.
  humanURL: https://policycheck.tools/docs#endpoint-x402
  baseURL: https://policycheck.tools
  tags:
  - x402
  - Micropayments
  - Agentic Commerce
  properties:
  - type: X-X402
    url: x402/policycheck-tools-x402.yml
  - type: Documentation
    url: https://policycheck.tools/docs#endpoint-x402
