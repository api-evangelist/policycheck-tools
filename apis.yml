- aid: policycheck-tools:policycheck-a2a-agent
  name: PolicyCheck A2A Agent
  description: >-
    JSON-RPC 2.0 Agent-to-Agent endpoint at https://policycheck.tools/api/a2a, discovered through an A2A agent card
    served at the legacy /.well-known/agent.json path (protocolVersion 0.2.0, seven skills: comprehensive policy
    analysis, quick risk check, return / shipping / warranty / terms analysis and signed seller assessment). The
    endpoint is stateless — message/send only, tasks/get returns -32001 — answered an anonymous request live on
    2026-09-19, and returns a completed task carrying the same structured fields as POST /api/check. The card
    grades conformant on the A2A 1.0.0 hard checks; its documentationUrl and pricing URLs are dead.
  humanURL: https://policycheck.tools/docs#endpoint-a2a
  baseURL: https://policycheck.tools/api/a2a
  tags:
  - A2A
  - AI Agents
  - Agentic Commerce
