aid: policycheck-tools
name: PolicyCheck
description: >-
  PolicyCheck (formerly LegalEasy) is a seller-policy risk intelligence service built for AI purchasing agents.
  Given a store URL or raw policy text it extracts structured facts from return, shipping, warranty, terms and
  privacy policies — return window, restocking fees, binding arbitration, class-action waivers, data selling —
  scores them deterministically into a 0-10 risk score and a 0-100 buyer protection score, labels standard
  boilerplate separately from unusual restrictions, and can return the result as an Ed25519-signed assessment an
  agent presents at checkout and a merchant verifies against a public JWKS. The surface is anonymous REST at
  policycheck.tools/api/check, an A2A JSON-RPC agent with a published agent card, a stdio MCP server on npm, an
  x402 pay-per-analysis endpoint settled in USDC on Base, a versioned clause registry, and a keyed audit log and
  compliance report. The published OpenAPI covers only the two legacy ChatGPT-plugin operations.
