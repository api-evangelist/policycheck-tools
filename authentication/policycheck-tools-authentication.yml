in_spec:
  security_schemes_declared: false
  note: >-
    The published OpenAPI declares no components.securitySchemes and no security requirement, which is accurate
    for the two anonymous operations it contains but leaves the X-API-Key endpoints entirely outside the
    contract. derive-authentication.py therefore produced nothing; this profile is built from the docs, the
    agent card and live probes.
gaps:
- No self-serve key issuance; no documented key format, rotation or revocation.
- The agent card says every call needs X-API-Key; the docs and the live endpoints say the analysis surface is free and anonymous. Agents that trust the card will stall on a credential they cannot obtain.
- No WWW-Authenticate challenge on the 401, so a client cannot discover the scheme from the response.
- No OAuth, OIDC or RFC 9728 metadata anywhere (all /.well-known discovery paths 404).
